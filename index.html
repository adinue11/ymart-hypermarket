    <!-- Critical boot screen: paints before any JS/CSS bundle arrives -->
    <style>
      html,body{margin:0;background:#0b0d0c}
      #boot{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;pointer-events:all;overflow:hidden}
      #boot .bp{position:absolute;top:0;bottom:0;width:50.2%;background:#0b0d0c;transition:transform 1s cubic-bezier(.76,0,.24,1) .12s}
      #boot .bp.l{left:0}#boot .bp.r{right:0}
      #boot .bc{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;color:#c8ff2e;transition:opacity .45s ease,transform .6s cubic-bezier(.76,0,.24,1)}
      #boot svg{width:74px;height:74px;overflow:visible}
      #boot .ring{stroke-dasharray:101;stroke-dashoffset:101;animation:bd 1s ease forwards}
      #boot .v{stroke-dasharray:60;stroke-dashoffset:60;animation:bd .8s .25s ease forwards}
      #boot b{font:700 30px/1 "Space Grotesk",system-ui,sans-serif;letter-spacing:-.08em;color:#f3f2eb}
      #boot .bar{width:150px;height:2px;background:rgba(255,255,255,.14);overflow:hidden;border-radius:2px}
      #boot .bar i{display:block;height:100%;width:100%;background:#c8ff2e;transform:scaleX(0);transform-origin:left;animation:bl 1.1s cubic-bezier(.6,0,.2,1) forwards}
      #boot.boot--out{pointer-events:none}
      #boot.boot--out .bc{opacity:0;transform:translateY(-26px) scale(.94)}
      #boot.boot--out .bp.l{transform:translateX(-101%)}
      #boot.boot--out .bp.r{transform:translateX(101%)}
      @keyframes bd{to{stroke-dashoffset:0}}
      @keyframes bl{to{transform:scaleX(1)}}
      @media (prefers-reduced-motion:reduce){#boot .ring,#boot .v{animation:none;stroke-dashoffset:0}#boot .bar i{animation:none;transform:none}}
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="bp l"></div><div class="bp r"></div>
      <div class="bc">
        <svg viewBox="0 0 38 38" fill="none"><circle class="ring" cx="19" cy="19" r="16" stroke="#c8ff2e" stroke-width="1.25" pathLength="101"/><path class="v" d="M8 8L19 20L30 8M19 20V31" stroke="#c8ff2e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="60"/></svg>
        <b>YMART.</b>
        <div class="bar"><i></i></div>
      </div>
    </div>
